<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honza</title>
<meta name="description" content="Elektrikář. Gamer. Petrolhead.">
<meta property="og:title" content="Honza">
<meta property="og:description" content="Elektrikář. Gamer. Petrolhead.">
<meta property="og:image" content="foto.jpg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230d0d0e'/><text x='50' y='68' font-size='58' font-family='Georgia' fill='%233b82f6' text-anchor='middle'>H</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0d0d0e;
  --text:#f4f2ec;
  --dim:#9c9a95;
  --dim2:#615f5a;
  --line:rgba(244,242,236,.09);
  --accent:#3b82f6;
  --ig:#e2569b;
  --sp:#1ed760;
  --tt:#42d6df;

  --font-head:'Space Grotesk',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}

body{
  min-height:100vh;
  font-family:var(--font-head);
  color:var(--text);
  background:
    radial-gradient(circle at 50% -10%, rgba(59,130,246,.12), transparent 55%),
    radial-gradient(circle at 100% 100%, rgba(59,130,246,.05), transparent 50%),
    var(--bg);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:28px;
  position:relative;
  -webkit-font-smoothing:antialiased;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(circle at 50% 30%,#000 0%,transparent 65%);
  -webkit-mask-image:radial-gradient(circle at 50% 30%,#000 0%,transparent 65%);
}

.card{
  position:relative;
  z-index:1;
  width:100%;
  max-width:400px;
  padding:40px 26px 28px;
  background:#141416;
  border:1px solid var(--line);
  border-radius:26px;
  box-shadow:0 28px 60px rgba(0,0,0,.5), 0 8px 20px rgba(59,130,246,.07);
  animation:in .5s cubic-bezier(.2,.7,.2,1) both;
  overflow:hidden;
}
.card::before{
  content:"";
  position:absolute;
  top:0;left:0;right:0;
  height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  opacity:.65;
}
@keyframes in{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:none}
}

/* one quiet typographic gesture instead of glow blobs or gradient text */
.monogram{
  position:absolute;
  top:-36px;
  right:-28px;
  font-size:210px;
  font-weight:700;
  line-height:1;
  color:rgba(59,130,246,.09);
  pointer-events:none;
  user-select:none;
  z-index:0;
}

.head{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  gap:16px;
  margin-bottom:26px;
}

.photo{
  width:68px;height:68px;
  flex-shrink:0;
  border-radius:16px;
  overflow:hidden;
  border:1px solid rgba(59,130,246,.4);
  background:#17171a;
  box-shadow:0 8px 20px rgba(0,0,0,.35);
  transition:transform .3s cubic-bezier(.2,.8,.2,1);
}
.photo:hover{ transform:rotate(-1.5deg) scale(1.05); }
.photo img{ width:100%;height:100%;object-fit:cover;display:block; }
.photo.no-photo{ display:flex;align-items:center;justify-content:center; }
.photo.no-photo::after{
  content:"H";
  font-size:26px;
  font-weight:700;
  color:var(--accent);
}

.head-text h1{
  font-size:24px;
  font-weight:600;
  letter-spacing:-.3px;
  margin-bottom:6px;
  position:relative;
  display:inline-block;
}
.head-text h1::after{
  content:"";
  position:absolute;
  left:0;bottom:-3px;
  width:22px;height:2px;
  background:var(--accent);
}
.meta{
  font-family:var(--font-mono);
  font-size:12px;
  color:var(--dim);
}
.meta .num{ color:var(--accent); }

.bio{
  position:relative;
  z-index:1;
  font-size:14.5px;
  line-height:1.65;
  color:#c8c6c0;
  margin-bottom:28px;
  max-width:34ch;
}
.bio strong{ color:var(--text); font-weight:600; }

hr{
  border:none;
  border-top:1px solid var(--line);
  margin-bottom:4px;
}

.links{
  position:relative;
  z-index:1;
  display:flex;
  flex-direction:column;
}
.link{
  display:flex;
  align-items:center;
  gap:12px;
  padding:15px 12px;
  margin:0 -12px;
  border-radius:14px;
  text-decoration:none;
  color:var(--dim);
  font-size:14px;
  font-weight:500;
  border-bottom:1px solid var(--line);
  transition:color .2s ease, background .25s ease, transform .2s ease;
  position:relative;
}
.links .link:last-child{ border-bottom:none; }
.link svg{
  width:16px;height:16px;
  flex-shrink:0;
  color:var(--dim2);
  transition:color .2s ease;
}
.link:hover, .link:focus-visible{ color:var(--text); background:rgba(255,255,255,.045); transform:translateX(2px); outline:none; }

.link.ig:hover svg, .link.ig:focus-visible svg{ color:var(--ig); }
.link.sp:hover svg, .link.sp:focus-visible svg{ color:var(--sp); }
.link.tt:hover svg, .link.tt:focus-visible svg{ color:var(--tt); }

.footer{
  position:relative;
  z-index:1;
  margin-top:22px;
  font-family:var(--font-mono);
  font-size:11px;
  color:var(--dim2);
}

@media (max-width:420px){
  .card{ padding:34px 20px 24px; }
  .monogram{ font-size:170px; top:-30px; }
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    transition-duration:.01ms !important;
  }
}
</style>
</head>
<body>

<main class="card">
  <span class="monogram">H</span>

  <div class="head">
    <div class="photo">
      <img src="foto.jpg" alt="Honza"
           onerror="this.style.display='none';this.parentNode.classList.add('no-photo');">
    </div>
    <div class="head-text">
      <h1>Honza</h1>
      <p class="meta">@jan._.kozak — <span class="num" id="age">18</span> let, Česko</p>
    </div>
  </div>

  <p class="bio">
    <strong>Elektrikář</strong> — údržba a opravy ve dne, <strong>gaming</strong> (nejradši 2D) a
    <strong>techno</strong> ve sluchátkách večer. Vysněný auto je <strong>Mazda RX-7</strong>.
  </p>

  <hr>
  <nav class="links">
    <a class="link ig" href="https://www.instagram.com/jan._.kozak/" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
      </svg>
      Instagram
    </a>
    <a class="link sp" href="https://open.spotify.com/user/31umdbit6xsszjedmw3xvgoi4siu" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.5 17.3c-.22.36-.68.47-1.04.25-2.85-1.74-6.44-2.13-10.67-1.17-.41.1-.83-.16-.92-.57-.1-.41.16-.83.57-.92 4.62-1.06 8.6-.6 11.8 1.36.36.22.47.68.25 1.04zm1.47-3.26c-.27.45-.86.59-1.31.31-3.26-2-8.23-2.58-12.08-1.41-.5.15-1.04-.13-1.19-.64-.15-.5.13-1.04.64-1.19 4.4-1.34 9.88-.69 13.63 1.61.45.27.59.86.31 1.31zm.13-3.4C15.2 8.32 8.76 8.11 5.02 9.25c-.6.18-1.23-.16-1.41-.75-.18-.6.16-1.23.75-1.41 4.29-1.3 11.4-1.05 15.9 1.62.54.32.72 1.02.4 1.56-.32.53-1.02.71-1.56.4z"/>
      </svg>
      Spotify
    </a>
    <a class="link tt" href="https://www.tiktok.com/@zizifromtur" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M16.8 3.2v5.3c-0.7-0.2-1.5-0.3-2.3-0.3-1.9 0-3.6 1.1-4.2 2.9-0.7 1.8-0.2 3.7 1.1 4.9 1.4 1.3 3.3 1.6 5 0.9V9.1h2V3.2h-1.6z"/>
      </svg>
      TikTok
    </a>
  </nav>

  <p class="footer">© 2026 Honza</p>
</main>

<script>
  (function(){
    const birthDate = new Date(2008, 0, 24);
    function getAge(){
      const now = new Date();
      let age = now.getFullYear() - birthDate.getFullYear();
      const m = now.getMonth() - birthDate.getMonth();
      if (m < 0 || (m === 0 && now.getDate() < birthDate.getDate())) age--;
      return age;
    }
    function updateAge(){
      const el = document.getElementById('age');
      if (el) el.textContent = getAge();
    }
    updateAge();
    setInterval(updateAge, 60 * 1000);
  })();
</script>
</body>
</html>
